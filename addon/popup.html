<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>🥑 Autocado</h1>
  <ul class="checks">
    <li id="server"><span class="dot"></span><span class="label">Autocado app</span><span class="detail"></span></li>
    <li id="ocado"><span class="dot"></span><span class="label">ocado.com tab</span><span class="detail"></span></li>
    <li id="signin"><span class="dot"></span><span class="label">Signed in to Ocado</span><span class="detail"></span></li>
  </ul>
  <p id="hint" class="hint"></p>
  <p id="last" class="muted"></p>
  <div class="row">
    <button id="open">Open Ocado</button>
    <button id="settings" class="ghost">Change Autocado address…</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
